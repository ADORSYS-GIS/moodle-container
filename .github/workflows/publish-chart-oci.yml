name: publish-chart-oci

# Publish the Helm chart to GHCR as an OCI artifact on merge to main.
#
#   oci://ghcr.io/adorsys-gis/charts/moodle
#
# i.e. the org-wide charts namespace. Consumers install straight from OCI
# instead of adding a classic index.yaml Helm repo.
#
# Versioning is monotonic + clean X.Y.Z, DERIVED AT PUBLISH TIME (never
# committed back into Chart.yaml — so this workflow can't re-trigger itself):
#   MAJOR.MINOR  ← the floor in charts/moodle/Chart.yaml `version:` (bump
#                  deliberately in a PR for a notable change)
#   PATCH        ← `git rev-list --count` of commits touching charts/moodle
#                  (auto-increments on every merge that touches it; monotonic).

on:
  push:
    branches: [main]
    paths:
      - "charts/moodle/**"
      - ".github/workflows/publish-chart-oci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Serialise publishes on main so two merges can't race the registry / count.
  group: oci-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OCI_REPO: oci://ghcr.io/adorsys-gis/charts
  CHART_DIR: charts/moodle

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history: patch counting via git rev-list

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Package & push chart
        run: |
          set -euo pipefail
          base=$(grep -E '^version:' "$CHART_DIR/Chart.yaml" | awk '{print $2}')
          mm="${base%.*}" # strip Chart.yaml patch → MAJOR.MINOR
          patch=$(git rev-list --count HEAD -- "$CHART_DIR")
          ver="${mm}.${patch}"
          echo "moodle → $ver"

          # Idempotent: skip if this exact version is already in the registry.
          if helm show chart "$OCI_REPO/moodle" --version "$ver" >/dev/null 2>&1; then
            echo "already published, skipping"
            exit 0
          fi

          helm dependency build "$CHART_DIR"
          helm lint "$CHART_DIR"
          mkdir -p /tmp/pkg
          helm package "$CHART_DIR" --version "$ver" --app-version "$ver" -d /tmp/pkg
          helm push "/tmp/pkg/moodle-${ver}.tgz" "$OCI_REPO"
